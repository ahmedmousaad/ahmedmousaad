name: Waka Readme

on:
  schedule:
    # يعمل تلقائياً كل يوم عند منتصف الليل
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً لتجربته فوراً

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}          
          SHOW_OS: "true"
          SHOW_PROJECTS: "true"
          SHOW_LANGUAGE: "true"
          SHOW_EDITORS: "true"
